# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# Display is a nice!view (e-paper), enabled by the nice_view shield itself
# (see flake.nix shield / nice_view.conf sets CONFIG_ZMK_DISPLAY=y).
# The OLED CONFIG_ZMK_DISPLAY path below is NOT used on this hardware.
# CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_MOUSE=y
# Uncomment to increase bluetooth range.  It also uses more battery.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="CorneMini"
# CONFIG_ZMK_STUDIO=yes

